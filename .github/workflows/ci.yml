name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # `check` runs the Kotlin + JNI tests (:tests:test), the compiler plugin's box and
      # diagnostic tests (:compiler-plugin:test), and the standalone CMake build of the C++
      # static library (:runtime:buildNative). CMake and Ninja are preinstalled on the runner.
      # It runs against the catalog's Kotlin — the oldest supported release, which is also the
      # one the universal artifacts (runtime, kolibri-android, gradle-plugin) are published with.
      - name: Run checks
        run: ./gradlew check --stacktrace

      # always(), not failure(): the reports are the only record of how many tests actually ran.
      # A task that is silently skipped still reports a green build, so keep the evidence.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  # The compiler plugin links against compiler internals, so every Kotlin release it is published
  # for gets its own build and test run. gradle/kotlin-versions.txt is the single list of those
  # releases (the publish workflow and scripts/test-all-versions.sh read the same file).
  kotlin-versions:
    name: Kotlin versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.read.outputs.versions }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Read gradle/kotlin-versions.txt
        id: read
        run: echo "versions=$(jq -R -s -c 'split("\n") | map(select(length > 0))' gradle/kotlin-versions.txt)" >> "$GITHUB_OUTPUT"

  test-kotlin:
    name: Kotlin ${{ matrix.kotlin-version }}
    needs: kotlin-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kotlin-version: ${{ fromJSON(needs.kotlin-versions.outputs.versions) }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Only the Kotlin-dependent half of `check`: the compiler plugin's own tests, the Gradle
      # plugin compiled against that release's KGP, and the runtime + JNI tests compiled with that
      # release's compiler. The C++ builds and the Android AAR do not depend on Kotlin and are
      # covered once by the `test` job above.
      - name: Run checks against Kotlin ${{ matrix.kotlin-version }}
        run: ./gradlew :compiler-plugin:test :gradle-plugin:build :tests:test -PkotlinVersion=${{ matrix.kotlin-version }} --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-kotlin-${{ matrix.kotlin-version }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
