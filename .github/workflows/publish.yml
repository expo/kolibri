name: Publish

on:
  release:
    types: [released, prereleased]
  workflow_dispatch: { }

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false"

jobs:
  stage-universal:
    name: Stage runtime, kolibri-android and gradle-plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Stage signed artifacts
        run: ./gradlew :runtime:publishAllPublicationsToCentralBundleRepository :kolibri-android:publishAllPublicationsToCentralBundleRepository :gradle-plugin:publishAllPublicationsToCentralBundleRepository
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}

      # Every compiler-plugin build writes its own compiler-plugin/maven-metadata.xml, which would
      # collide in the `publish` job. Central does not need it, so it stays out of every bundle.
      - name: Upload staged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: central-bundle-universal
          path: |
            build/central-bundle/
            !build/central-bundle/**/maven-metadata.xml*
          if-no-files-found: error
          retention-days: 7

  kotlin-versions:
    name: Kotlin versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.read.outputs.versions }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Read gradle/kotlin-versions.txt
        id: read
        run: echo "versions=$(jq -R -s -c 'split("\n") | map(select(length > 0))' gradle/kotlin-versions.txt)" >> "$GITHUB_OUTPUT"

  # A compiler plugin is bound to the exact compiler it was built against, so it is published once
  # per supported Kotlin release, as `compiler-plugin:<version>-<kotlin>`. Its version is set apart
  # from the rest (see gradle/libs.versions.toml), and a build Maven Central already holds is not
  # published again.
  stage-compiler:
    name: Stage compiler-plugin for Kotlin ${{ matrix.kotlin-version }}
    needs: kotlin-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kotlin-version: ${{ fromJSON(needs.kotlin-versions.outputs.versions) }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the compiler plugin
        run: ./gradlew :compiler-plugin:jar -PkotlinVersion=${{ matrix.kotlin-version }}

      # The build is reproducible, so a jar with the same contents on Central is this exact plugin,
      # and is skipped. A different one under the same version means the plugin changed without a
      # bump of `compiler-plugin` in gradle/libs.versions.toml, and fails the release before anything
      # is uploaded.
      - name: Compare with Maven Central
        id: central
        run: |
          version="$(sed -n 's/^compiler-plugin *= *"\(.*\)"/\1/p' gradle/libs.versions.toml)-$KOTLIN_VERSION"
          state=$(scripts/compare-with-maven-central.sh \
            "compiler-plugin/build/libs/compiler-plugin-$version.jar" \
            "io/github/expo/kolibri/compiler-plugin/$version/compiler-plugin-$version.jar") || status=$?
          if [[ ${status:-0} == 3 ]]; then
            echo "::error::The compiler plugin changed since $version was published. Bump compiler-plugin in gradle/libs.versions.toml."
          fi
          [[ ${status:-0} == 0 ]] || exit 1
          if [[ $state == published ]]; then
            echo "::notice::io.github.expo.kolibri:compiler-plugin:$version is already on Maven Central, skipping it."
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
        env:
          KOTLIN_VERSION: ${{ matrix.kotlin-version }}

      - name: Stage signed artifacts
        if: steps.central.outputs.state == 'unpublished'
        run: ./gradlew :compiler-plugin:publishAllPublicationsToCentralBundleRepository -PkotlinVersion=${{ matrix.kotlin-version }}
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}

      - name: Upload staged artifacts
        if: steps.central.outputs.state == 'unpublished'
        uses: actions/upload-artifact@v4
        with:
          name: central-bundle-kotlin-${{ matrix.kotlin-version }}
          path: |
            build/central-bundle/
            !build/central-bundle/**/maven-metadata.xml*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to Maven Central
    needs: [stage-universal, stage-compiler]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download staged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: central-bundle-*
          path: build/central-bundle/
          merge-multiple: true

      - name: Upload one deployment to Maven Central
        run: scripts/publish-to-maven-central.sh build/central-bundle "$DEPLOYMENT_NAME"
        env:
          DEPLOYMENT_NAME: kolibri-${{ github.ref_name }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
